<!DOCTYPE html>
<!--
  WriteWise for Google Docs: sidebar.
  docs-addon/dist/Sidebar.html is generated from this file by `npm run build:docs-addon`,
  which inlines the WriteWise engine bundle and the Hunspell en-US dictionary so the
  sidebar never makes a network request. MIT License (repository LICENSE); the
  dictionary is SCOWL-licensed (public/dict/LICENSE-dictionary-en.txt); bundled npm
  packages (retext, nspell, unified, ...) are MIT-licensed.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <base target="_top">
  <title>WriteWise</title>
  <style>
    :root { --bg: #ffffff; --surface-2: #f8fafc; --text: #1a1f29; --muted: #66707f; --border: #e3e7ec; --accent: #15c39a; --accent-ink: #0d7d63; --correctness: #e5484d; --clarity: #3b82f6; --engagement: #16a34a; --delivery: #8b5cf6; --prompt: #f59e0b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .top { padding: 10px 12px 8px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 2; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; margin-bottom: 8px; }
    .logo { width: 18px; height: 18px; border-radius: 5px; background: var(--accent); display: inline-block; position: relative; }
    .logo::after { content: ""; position: absolute; left: 6px; top: 3px; width: 4px; height: 9px; border: solid #062b22; border-width: 0 2px 2px 0; transform: rotate(45deg); }
    .tag { margin-left: auto; font-size: 11px; font-weight: 500; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
    .btn { border: 1px solid var(--border); background: #fff; color: var(--text); border-radius: 7px; padding: 6px 10px; cursor: pointer; font: inherit; font-size: 12.5px; line-height: 1.2; }
    .btn:hover:not(:disabled) { background: var(--surface-2); }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn.accent { background: var(--accent); border-color: var(--accent); color: #062b22; font-weight: 600; }
    .btn.small { padding: 3px 8px; font-size: 12px; }
    .btn.ghost { border-color: transparent; color: var(--muted); }
    .btn.fix { font-weight: 600; border-color: #bfe9dc; background: #effaf6; }
    select { font: inherit; font-size: 12.5px; border: 1px solid var(--border); border-radius: 7px; padding: 5px 6px; background: #fff; color: var(--text); }
    .status { color: var(--muted); font-size: 12px; min-height: 16px; margin-top: 4px; }
    .status.err { color: var(--correctness); }
    main { flex: 1; padding: 8px 12px 12px; }
    .summary { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 8px; }
    .summary:empty { display: none; }
    .pill { font: inherit; font-size: 11px; border-radius: 999px; padding: 2px 8px; border: 1px solid var(--border); color: var(--muted); cursor: pointer; background: #fff; }
    .pill.active { color: var(--text); font-weight: 600; border-color: var(--text); }
    .pill .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
    .card { border: 1px solid var(--border); border-left-width: 4px; border-radius: 10px; padding: 8px 10px; margin: 0 0 8px; background: #fff; cursor: pointer; }
    .card:hover, .card:focus { box-shadow: 0 2px 10px rgba(20, 30, 50, .08); outline: none; }
    .card.c-correctness { border-left-color: var(--correctness); }
    .card.c-clarity { border-left-color: var(--clarity); }
    .card.c-engagement { border-left-color: var(--engagement); }
    .card.c-delivery { border-left-color: var(--delivery); }
    .card.c-prompt { border-left-color: var(--prompt); }
    .card .head { display: flex; align-items: baseline; gap: 6px; margin-bottom: 3px; }
    .card .title { font-weight: 600; }
    .card .auto { font-size: 10px; color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 4px; padding: 0 4px; }
    .card .cat { margin-left: auto; font-size: 11px; color: var(--muted); }
    .excerpt { font-family: Charter, Georgia, "Times New Roman", serif; font-size: 13px; background: var(--surface-2); border-radius: 6px; padding: 3px 6px; margin: 4px 0; white-space: pre-wrap; word-break: break-word; }
    .msg { margin: 4px 0 6px; color: #3b4350; }
    .actions { display: flex; gap: 4px; flex-wrap: wrap; }
    .empty { color: var(--muted); text-align: center; padding: 30px 10px; }
    .prompt-box { border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); padding: 8px 10px; margin: 4px 0 10px; }
    .prompt-box .score { font-weight: 700; font-size: 16px; }
    .prompt-box ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 3px; }
    .prompt-box li { display: grid; grid-template-columns: 16px 1fr; gap: 0 4px; font-size: 12px; }
    .prompt-box li .hint { grid-column: 2; color: var(--muted); font-size: 11px; }
    .prompt-box li.ok .mark { color: var(--engagement); font-weight: 700; }
    .prompt-box li.missing .mark { color: var(--prompt); font-weight: 700; }
    .prompt-box li.missing .label { font-weight: 600; }
    footer { border-top: 1px solid var(--border); padding: 6px 12px 10px; font-size: 12px; color: var(--muted); }
    details summary { cursor: pointer; font-weight: 600; color: var(--text); }
    footer label { display: flex; gap: 6px; align-items: center; margin: 4px 0; color: var(--text); }
    .words { display: flex; gap: 4px; flex-wrap: wrap; margin: 4px 0 6px; }
    .word { border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px; background: #fff; color: var(--text); }
    .word button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 0 0 4px; font: inherit; }
    .spinner { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; margin-right: 5px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="top">
    <div class="brand"><span class="logo"></span>WriteWise <span class="tag" title="The checker runs inside this sidebar. Nothing is sent anywhere.">offline</span></div>
    <div class="row">
      <button class="btn accent" id="check" disabled>Check document</button>
      <select id="mode" title="What you are writing">
        <option value="writing">Writing</option>
        <option value="prompt">AI prompt</option>
      </select>
    </div>
    <div class="row">
      <button class="btn" id="fix-all" disabled title="Apply every fix that is safe to make without asking">Fix all safe</button>
      <button class="btn" id="make-prompt" disabled title="Insert a structured AI prompt below the selection">Make it a prompt</button>
    </div>
    <div class="status" id="status"><span class="spinner"></span>Loading dictionary…</div>
  </div>
  <main>
    <div class="prompt-box" id="prompt-box" hidden></div>
    <div class="summary" id="summary"></div>
    <div id="list"><div class="empty">Click <b>Check document</b> to get suggestions.<br>Nothing leaves this document: the checker runs inside this sidebar.</div></div>
  </main>
  <footer>
    <details>
      <summary>Settings</summary>
      <label><input type="checkbox" id="opt-passive"> Flag passive voice</label>
      <label><input type="checkbox" id="opt-readability"> Flag hard-to-read sentences</label>
      <label><input type="checkbox" id="opt-wordiness"> Flag wordy phrases</label>
      <label><input type="checkbox" id="opt-equality"> Flag insensitive language</label>
      <div>Personal dictionary</div>
      <div class="words" id="words"><span class="empty-words">No words yet. Use “Add to dictionary” on a spelling card.</span></div>
    </details>
  </footer>

  <script>
    // Hunspell en-US dictionary, inlined by scripts/build-docs-addon.mjs.
    var WW_AFF = "__AFF__";
    var WW_DIC = "__DIC__";
  </script>
  <script>
    /*__ENGINE__*/
  </script>
  <script>
    (function () {
      'use strict';
      var E = window.WriteWiseEngine;
      var $ = function (id) { return document.getElementById(id); };
      var CATEGORY = { correctness: 'Correctness', clarity: 'Clarity', engagement: 'Engagement', delivery: 'Delivery', prompt: 'Prompt' };
      var DEFAULT_SETTINGS = { mode: 'writing', passive: true, readability: true, wordiness: true, equality: true, personal: [] };
      var MAX_PERSONAL = 300;

      var state = { checker: null, ready: false, busy: false, settings: Object.assign({}, DEFAULT_SETTINGS), items: [], filter: null, prompt: null, dismissed: {} };

      // --- bridge to Code.js (google.script.run), or to the local test harness when opened outside Docs ---
      function rpc(name) {
        var args = Array.prototype.slice.call(arguments, 1);
        var inDocs = typeof google !== 'undefined' && google.script && google.script.run;
        if (!inDocs) {
          var mock = window.parent && window.parent !== window ? window.parent.__writewiseDocsMock : null;
          if (!mock) return Promise.reject(new Error('Not running inside Google Docs'));
          return Promise.resolve().then(function () { return mock[name].apply(mock, args); });
        }
        return new Promise(function (resolve, reject) {
          var runner = google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(function (err) { reject(err instanceof Error ? err : new Error(String((err && err.message) || err))); });
          runner[name].apply(runner, args);
        });
      }

      function tick() { return new Promise(function (r) { setTimeout(r, 0); }); }

      function setStatus(message, working, error) {
        var el = $('status');
        el.className = 'status' + (error ? ' err' : '');
        el.textContent = '';
        if (working) { var s = document.createElement('span'); s.className = 'spinner'; el.appendChild(s); }
        el.appendChild(document.createTextNode(message));
      }

      function options(mode) {
        var s = state.settings;
        return { mode: mode || s.mode, passive: !!s.passive, readability: !!s.readability, wordiness: !!s.wordiness, equality: !!s.equality, profanity: false, personal: s.personal.slice() };
      }

      function guarded(fn) {
        return function () {
          if (state.busy || !state.ready) return;
          state.busy = true;
          updateButtons();
          var args = arguments;
          Promise.resolve().then(function () { return fn.apply(null, args); })
            .catch(function (e) { setStatus((e && e.message) || String(e), false, true); })
            .then(function () { state.busy = false; updateButtons(); });
        };
      }

      function updateButtons() {
        var idle = state.ready && !state.busy;
        $('check').disabled = !idle;
        $('make-prompt').disabled = !idle;
        var n = safeFixes().length;
        $('fix-all').disabled = !idle || n === 0;
        $('fix-all').textContent = n ? 'Fix all safe (' + n + ')' : 'Fix all safe';
      }

      // --- checking ---
      function locateParagraph(starts, offset) {
        var lo = 0, hi = starts.length - 1;
        while (lo < hi) { var mid = (lo + hi + 1) >> 1; if (starts[mid] <= offset) lo = mid; else hi = mid - 1; }
        return lo;
      }

      function dismissKey(issue) { return issue.ruleId + '|' + issue.actual; }

      async function doCheck() {
        setStatus('Reading the document…', true);
        var doc = await rpc('getDocumentText');
        var paragraphs = doc.paragraphs || [];
        var joined = '', starts = [];
        for (var i = 0; i < paragraphs.length; i++) {
          if (i) joined += '\n';
          starts.push(joined.length);
          joined += paragraphs[i].text;
        }
        if (!joined.trim()) { state.items = []; state.prompt = null; render(); setStatus('The document is empty.'); return; }
        setStatus('Checking…', true);
        await tick();
        var result = await state.checker.check(joined, options());
        var items = [];
        var personal = {};
        state.settings.personal.forEach(function (w) { personal[w.toLowerCase()] = true; });
        for (var k = 0; k < result.issues.length; k++) {
          var issue = result.issues[k];
          var pi = locateParagraph(starts, issue.start);
          var pStart = starts[pi], pEnd = pStart + paragraphs[pi].text.length;
          if (issue.end > pEnd || issue.start < pStart) continue; // spans two paragraphs
          if (state.dismissed[dismissKey(issue)]) continue;
          if (isSpelling(issue) && personal[issue.actual.toLowerCase()]) continue;
          items.push({ issue: issue, p: paragraphs[pi].index, start: issue.start - pStart, end: issue.end - pStart, text: joined.slice(issue.start, issue.end), safe: E.isSafeFix(issue) });
        }
        state.items = items;
        state.prompt = result.prompt;
        render();
        var words = result.stats.words;
        setStatus(items.length ? items.length + ' suggestion' + (items.length === 1 ? '' : 's') + ' in ' + words + ' word' + (words === 1 ? '' : 's') + '.' : 'No suggestions in ' + words + ' words. Nice work!');
      }

      function isSpelling(issue) { return issue.ruleId.indexOf('retext-spell:') === 0; }

      function safeFixes() {
        var sorted = state.items.filter(function (it) { return it.safe !== null; }).sort(function (a, b) { return a.p - b.p || a.start - b.start; });
        var out = [], lastP = -1, lastEnd = -1;
        sorted.forEach(function (it) {
          if (it.p === lastP && it.start < lastEnd) return;
          out.push({ paragraphIndex: it.p, start: it.start, end: it.end, replacement: it.safe, expected: it.text });
          lastP = it.p; lastEnd = it.end;
        });
        return out;
      }

      // --- applying ---
      async function doApply(item, replacement) {
        setStatus('Applying…', true);
        var r = await rpc('applyFix', item.p, item.start, item.end, replacement, item.text);
        if (!r || !r.applied) {
          setStatus('That text has changed in the document. Checking again…', true);
          await doCheck();
          return;
        }
        var delta = replacement.length - (item.end - item.start);
        state.items = state.items.filter(function (it) {
          return it !== item && !(it.p === item.p && it.start < item.end && item.start < it.end);
        }).map(function (it) {
          if (it.p === item.p && it.start >= item.end) { it.start += delta; it.end += delta; }
          return it;
        });
        render();
        setStatus(state.items.length ? 'Applied. ' + state.items.length + ' left.' : 'Applied. No suggestions left.');
      }

      async function doFixAll() {
        var fixes = safeFixes();
        if (!fixes.length) return;
        setStatus('Applying ' + fixes.length + ' fix' + (fixes.length === 1 ? '' : 'es') + '…', true);
        var r = await rpc('applyFixes', fixes);
        var note = r.applied + ' fix' + (r.applied === 1 ? '' : 'es') + ' applied' + (r.skipped ? ' (' + r.skipped + ' skipped because the text changed)' : '') + '. Checking again…';
        setStatus(note, true);
        await doCheck();
      }

      async function doMakePrompt() {
        setStatus('Reading the selection…', true);
        var src = await rpc('getPromptSource');
        var text = (src && src.text ? String(src.text) : '').trim();
        if (!text) { setStatus('Select some text, or put the cursor in a paragraph, then try again.'); return; }
        setStatus('Building the prompt…', true);
        await tick();
        var result = await state.checker.check(text, options('writing'));
        var fixed = E.autoFix(text, result.issues).text;
        var report = E.analyzePrompt(fixed);
        var template = E.buildPromptTemplate(fixed, report);
        var lines = template.replace(/\s+$/, '').split('\n');
        await rpc('insertPrompt', lines);
        var where = src.scope === 'selection' ? 'the selection' : src.scope === 'cursor' ? 'that paragraph' : 'the document';
        setStatus('Structured prompt inserted below ' + where + ' (score before: ' + report.score + '/100). Fill in the [brackets].');
      }

      function dismiss(item) {
        state.dismissed[dismissKey(item.issue)] = true;
        state.items = state.items.filter(function (it) { return it !== item; });
        render();
      }

      function addToDictionary(item) {
        var word = item.issue.actual;
        var lower = word.toLowerCase();
        if (state.settings.personal.some(function (w) { return w.toLowerCase() === lower; })) return;
        if (state.settings.personal.length >= MAX_PERSONAL) { setStatus('The personal dictionary is full (' + MAX_PERSONAL + ' words).', false, true); return; }
        state.settings.personal.push(word);
        state.items = state.items.filter(function (it) { return !(isSpelling(it.issue) && it.issue.actual.toLowerCase() === lower); });
        persistSettings();
        render();
        setStatus('“' + word + '” added to your dictionary.');
      }

      function removeFromDictionary(word) {
        state.settings.personal = state.settings.personal.filter(function (w) { return w !== word; });
        persistSettings();
        renderWords();
      }

      function locate(item) {
        rpc('selectRange', item.p, item.start, item.end, item.text).then(function (r) {
          if (!r || !r.ok) setStatus('That text has moved. Click Check document to refresh.', false, true);
        }).catch(function (e) { setStatus((e && e.message) || String(e), false, true); });
      }

      // --- settings ---
      function applySettings(saved) {
        if (!saved || typeof saved !== 'object') return;
        ['passive', 'readability', 'wordiness', 'equality'].forEach(function (k) { if (typeof saved[k] === 'boolean') state.settings[k] = saved[k]; });
        if (saved.mode === 'writing' || saved.mode === 'prompt') state.settings.mode = saved.mode;
        if (Array.isArray(saved.personal)) state.settings.personal = saved.personal.filter(function (w) { return typeof w === 'string' && w.length < 60; }).slice(0, MAX_PERSONAL);
      }

      function persistSettings() {
        rpc('saveSettings', JSON.stringify(state.settings)).catch(function () { /* settings are a convenience; keep going */ });
      }

      function syncSettingsUi() {
        $('mode').value = state.settings.mode;
        $('opt-passive').checked = state.settings.passive;
        $('opt-readability').checked = state.settings.readability;
        $('opt-wordiness').checked = state.settings.wordiness;
        $('opt-equality').checked = state.settings.equality;
        renderWords();
      }

      // --- rendering ---
      function render() { renderPromptBox(); renderSummary(); renderList(); renderWords(); updateButtons(); }

      function renderPromptBox() {
        var box = $('prompt-box');
        var report = state.prompt;
        if (!report || state.settings.mode !== 'prompt') { box.hidden = true; box.textContent = ''; return; }
        box.hidden = false;
        box.textContent = '';
        var head = document.createElement('div');
        var score = document.createElement('span'); score.className = 'score'; score.textContent = report.score + '/100';
        head.appendChild(score);
        head.appendChild(document.createTextNode(' prompt completeness'));
        box.appendChild(head);
        var ul = document.createElement('ul');
        report.checks.forEach(function (c) {
          var li = document.createElement('li'); li.className = c.ok ? 'ok' : 'missing';
          var mark = document.createElement('span'); mark.className = 'mark'; mark.textContent = c.ok ? '✓' : '!';
          var label = document.createElement('span'); label.className = 'label'; label.textContent = c.label;
          li.appendChild(mark); li.appendChild(label);
          if (!c.ok) { var hint = document.createElement('span'); hint.className = 'hint'; hint.textContent = c.hint; li.appendChild(hint); }
          ul.appendChild(li);
        });
        box.appendChild(ul);
      }

      function renderSummary() {
        var el = $('summary');
        el.textContent = '';
        if (!state.items.length) return;
        var counts = {};
        state.items.forEach(function (it) { counts[it.issue.category] = (counts[it.issue.category] || 0) + 1; });
        Object.keys(CATEGORY).forEach(function (cat) {
          if (!counts[cat]) return;
          var b = document.createElement('button');
          b.className = 'pill' + (state.filter === cat ? ' active' : '');
          var dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = 'var(--' + cat + ')';
          b.appendChild(dot);
          b.appendChild(document.createTextNode(CATEGORY[cat] + ' ' + counts[cat]));
          b.addEventListener('click', function () { state.filter = state.filter === cat ? null : cat; renderSummary(); renderList(); });
          el.appendChild(b);
        });
      }

      function renderList() {
        var list = $('list');
        list.textContent = '';
        var items = state.items.filter(function (it) { return !state.filter || it.issue.category === state.filter; })
          .sort(function (a, b) { return a.p - b.p || a.start - b.start; });
        if (!items.length) {
          var empty = document.createElement('div'); empty.className = 'empty';
          empty.textContent = state.items.length ? 'Nothing in this category.' : 'No suggestions.';
          list.appendChild(empty);
          return;
        }
        items.forEach(function (it) { list.appendChild(renderCard(it)); });
      }

      function renderCard(item) {
        var issue = item.issue;
        var card = document.createElement('article');
        card.className = 'card c-' + issue.category;
        card.tabIndex = 0;
        var head = document.createElement('div'); head.className = 'head';
        var title = document.createElement('span'); title.className = 'title'; title.textContent = issue.title;
        head.appendChild(title);
        if (item.safe !== null) { var auto = document.createElement('span'); auto.className = 'auto'; auto.title = 'Included in “Fix all safe”'; auto.textContent = 'auto'; head.appendChild(auto); }
        var cat = document.createElement('span'); cat.className = 'cat'; cat.textContent = CATEGORY[issue.category] || issue.category;
        head.appendChild(cat);
        card.appendChild(head);
        var excerpt = document.createElement('div'); excerpt.className = 'excerpt';
        excerpt.textContent = item.text.length > 80 ? item.text.slice(0, 77) + '…' : item.text;
        card.appendChild(excerpt);
        var msg = document.createElement('p'); msg.className = 'msg'; msg.textContent = issue.message;
        card.appendChild(msg);
        var actions = document.createElement('div'); actions.className = 'actions';
        issue.replacements.slice(0, 3).forEach(function (rep) {
          var b = document.createElement('button'); b.className = 'btn small fix';
          b.textContent = rep === '' ? 'Remove' : rep;
          b.addEventListener('click', function (ev) { ev.stopPropagation(); guarded(doApply)(item, rep); });
          actions.appendChild(b);
        });
        var dis = document.createElement('button'); dis.className = 'btn small ghost'; dis.textContent = 'Ignore';
        dis.addEventListener('click', function (ev) { ev.stopPropagation(); dismiss(item); });
        actions.appendChild(dis);
        if (isSpelling(issue)) {
          var add = document.createElement('button'); add.className = 'btn small ghost'; add.textContent = 'Add to dictionary';
          add.addEventListener('click', function (ev) { ev.stopPropagation(); addToDictionary(item); });
          actions.appendChild(add);
        }
        card.appendChild(actions);
        card.addEventListener('click', function () { locate(item); });
        card.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') locate(item); });
        return card;
      }

      function renderWords() {
        var el = $('words');
        el.textContent = '';
        if (!state.settings.personal.length) {
          var none = document.createElement('span'); none.className = 'empty-words'; none.textContent = 'No words yet. Use “Add to dictionary” on a spelling card.';
          el.appendChild(none);
          return;
        }
        state.settings.personal.forEach(function (w) {
          var chip = document.createElement('span'); chip.className = 'word'; chip.textContent = w;
          var x = document.createElement('button'); x.textContent = '×'; x.title = 'Remove'; x.setAttribute('aria-label', 'Remove ' + w);
          x.addEventListener('click', function () { removeFromDictionary(w); });
          chip.appendChild(x);
          el.appendChild(chip);
        });
      }

      // --- wiring ---
      $('check').addEventListener('click', guarded(doCheck));
      $('fix-all').addEventListener('click', guarded(doFixAll));
      $('make-prompt').addEventListener('click', guarded(doMakePrompt));
      $('mode').addEventListener('change', function () { state.settings.mode = $('mode').value; persistSettings(); if (state.items.length) guarded(doCheck)(); else renderPromptBox(); });
      [['opt-passive', 'passive'], ['opt-readability', 'readability'], ['opt-wordiness', 'wordiness'], ['opt-equality', 'equality']].forEach(function (pair) {
        $(pair[0]).addEventListener('change', function () { state.settings[pair[1]] = $(pair[0]).checked; persistSettings(); });
      });

      async function init() {
        if (!E || typeof E.createChecker !== 'function') { setStatus('The engine bundle is missing. Run npm run build:docs-addon.', false, true); return; }
        var savedSettings = rpc('getSettings').catch(function () { return null; });
        state.checker = E.createChecker({ aff: WW_AFF, dic: WW_DIC });
        await tick();
        try {
          applySettings(await savedSettings);
        } catch (e) { /* defaults */ }
        syncSettingsUi();
        await state.checker.check('Warming up the dictionary.', options('writing')); // builds the spell checker once
        state.ready = true;
        updateButtons();
        setStatus('Ready. Click Check document.');
      }

      init().catch(function (e) { setStatus('Could not start: ' + ((e && e.message) || e), false, true); });
    })();
  </script>
</body>
</html>
