<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>WriteWise overlay</title>
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; font: 13px/1.45 -apple-system, system-ui, sans-serif; -webkit-user-select: none; }
  .s { position: absolute; cursor: pointer; border-radius: 3px; background: rgba(229, 72, 77, .09); box-shadow: inset 0 -2px 0 rgba(229, 72, 77, .55); }
  .s.clarity { background: rgba(240, 160, 32, .10); box-shadow: inset 0 -2px 0 rgba(240, 160, 32, .6); }
  .s:hover, .s.open { background: rgba(229, 72, 77, .16); }
  .s.clarity:hover, .s.clarity.open { background: rgba(240, 160, 32, .18); }
  .u { position: absolute; pointer-events: none; }
  .u::after { content: ""; position: absolute; left: 0; right: 0; bottom: 1px; height: 2px; border-radius: 2px; background: #e5484d; }
  .u.clarity::after, .u.tone::after, .u.prompt::after, .u.style::after { background: #f0a020; }
  .card { position: absolute; width: 360px; box-sizing: border-box; padding: 12px 14px; border-radius: 12px; background: #fff; color: #15171a; box-shadow: 0 10px 30px rgba(0,0,0,.25), 0 0 0 1px rgba(0,0,0,.08); z-index: 10; }
  .card h1 { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; opacity: .6; }
  .card .diff { margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: #f5f6f8; line-height: 1.5; -webkit-user-select: text; }
  .card del { color: #b42318; background: #fde8e8; text-decoration: line-through; border-radius: 3px; padding: 0 1px; }
  .card ins { color: #0f6b3a; background: #dcf5e6; text-decoration: none; border-radius: 3px; padding: 0 1px; }
  .card .notes { margin: 0 0 10px; padding: 0; list-style: none; }
  .card .notes li { margin: 4px 0; padding-left: 10px; border-left: 2px solid #f0a020; opacity: .85; }
  .card .notes b { font-weight: 600; }
  .card .ai { margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: #eef3ff; -webkit-user-select: text; }
  .card .ai .label { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; opacity: .6; margin-bottom: 4px; }
  .card .ai.busy { opacity: .7; font-style: italic; }
  .card .ai.error { background: #fdecec; color: #8a1c1c; }
  .card .row { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; margin-top: 6px; }
  .card button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; padding: 7px 11px; }
  .card .primary { background: #1a4fd8; color: #fff; font-weight: 600; }
  .card .primary:hover { background: #1641b3; }
  .card .secondary { background: #eef3ff; color: #1a4fd8; font-weight: 600; }
  .card .secondary:hover { background: #dde7ff; }
  .card .secondary:disabled { opacity: .5; cursor: default; }
  .card .ghost { background: transparent; color: #666; }
  .card .ghost:hover { background: #f0f0f0; }
  @media (prefers-color-scheme: dark) {
    .card { background: #1f2125; color: #ececec; box-shadow: 0 10px 30px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.1); }
    .card .diff { background: #2a2d33; }
    .card del { color: #ff9a9a; background: #4a1f22; }
    .card ins { color: #8fe3b0; background: #1d3f2c; }
    .card .ai { background: #243049; }
    .card .ai.error { background: #4a1f22; color: #ffb4b4; }
    .card .secondary { background: #243049; color: #9ec1ff; }
    .card .secondary:hover { background: #2d3b5a; }
    .card .ghost { color: #aaa; }
    .card .ghost:hover { background: #2a2d33; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const root = document.getElementById('root')
  let state = { items: [], card: null, size: [0, 0], aiAvailable: false }
  let ai = {}          // id -> { busy, text, error }
  let hovering = false
  const CARD_W = 360
  function setHover(v) { if (hovering !== v) { hovering = v; window.overlay.hover(v) } }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]) }
  function closeCard() { state.card = null; window.overlay.card(null); setHover(false); render() }

  // Word-level diff (longest common subsequence over tokens, whitespace kept) rendered as <del>/<ins>.
  function diffHtml(a, b) {
    const ta = a.split(/(\s+)/).filter(Boolean), tb = b.split(/(\s+)/).filter(Boolean)
    const n = ta.length, m = tb.length
    const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0))
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = ta[i] === tb[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1])
    let i = 0, j = 0, out = ''
    const flush = (dels, inss) => { if (dels.trim()) out += '<del>' + esc(dels.trim()) + '</del> '; else out += esc(dels); if (inss.trim()) out += '<ins>' + esc(inss.trim()) + '</ins> ' }
    let dels = '', inss = ''
    while (i < n || j < m) {
      if (i < n && j < m && ta[i] === tb[j]) { flush(dels, inss); dels = ''; inss = ''; out += esc(ta[i]); i++; j++ }
      else if (j < m && (i >= n || dp[i][j + 1] >= dp[i + 1][j])) { inss += tb[j]; j++ }
      else { dels += ta[i]; i++ }
    }
    flush(dels, inss)
    return out.replace(/\s+$/, '')
  }

  function report() {
    const rect = (el) => { const r = el.getBoundingClientRect(); return [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)] }
    const sentences = [...root.querySelectorAll('.s')].map(rect)
    const card = root.querySelector('.card')
    window.overlay.regions(card ? [...sentences, rect(card)] : sentences)
    window.overlay.debug({ underlines: sentences, buttons: [...root.querySelectorAll('.card button')].map((b) => ({ text: b.textContent.trim(), rect: rect(b) })) })
  }

  function render() {
    root.innerHTML = ''
    for (const it of state.items) {
      for (const ln of it.lines) {
        const s = document.createElement('div')
        s.className = 's ' + it.tone + (state.card === it.id ? ' open' : '')
        s.style.left = ln.x + 'px'; s.style.top = ln.y + 'px'
        s.style.width = Math.max(6, ln.w) + 'px'; s.style.height = Math.max(8, ln.h) + 'px'
        s.title = it.count === 1 ? '1 suggestion' : it.count + ' suggestions'
        s.onmouseenter = () => setHover(true)
        s.onmouseleave = () => { if (state.card !== it.id) setHover(false) }
        s.onclick = (e) => { e.stopPropagation(); state.card = state.card === it.id ? null : it.id; window.overlay.card(state.card); render() }
        root.appendChild(s)
      }
      for (const w of it.words) {
        const u = document.createElement('div')
        u.className = 'u ' + w.category
        u.style.left = w.x + 'px'; u.style.top = w.y + 'px'; u.style.width = Math.max(4, w.w) + 'px'; u.style.height = Math.max(6, w.h) + 'px'
        root.appendChild(u)
      }
    }
    const it = state.items.find((i) => i.id === state.card)
    if (!it) { report(); return }
    const c = document.createElement('div')
    c.className = 'card'
    const last = it.lines[it.lines.length - 1]
    const left = Math.min(Math.max(8, it.lines[0].x), Math.max(8, state.size[0] - CARD_W - 8))
    c.style.left = left + 'px'
    c.style.top = (last.y + last.h + 8) + 'px'
    const a = ai[it.id] || {}
    let body = ''
    if (it.changes > 0) body += `<div class="diff">${diffHtml(it.sentence, it.fixed)}</div>`
    if (it.notes.length) body += `<ul class="notes">${it.notes.map((n) => `<li><b>${esc(n.title)}.</b> ${esc(n.message)}</li>`).join('')}</ul>`
    if (a.busy) body += `<div class="ai busy"><div class="label">Claude</div>Thinking about this sentence in context…</div>`
    else if (a.error) body += `<div class="ai error"><div class="label">Claude</div>${esc(a.error)}</div>`
    else if (a.text) body += `<div class="ai"><div class="label">Claude, in context</div>${diffHtml(it.sentence, a.text)}</div>`
    const buttons = []
    if (a.text && a.text !== it.sentence) buttons.push('<button class="primary" data-act="use-ai">Use Claude’s version</button>')
    if (it.changes > 0 && it.fixed !== it.sentence) buttons.push(`<button class="${a.text ? 'secondary' : 'primary'}" data-act="fix">Fix sentence${it.changes > 1 ? ' (' + it.changes + ' changes)' : ''}</button>`)
    if (state.aiAvailable && !a.text) buttons.push(`<button class="secondary" data-act="ai" ${a.busy ? 'disabled' : ''}>Rewrite with Claude</button>`)
    buttons.push('<button class="ghost" data-act="dismiss">Dismiss</button>', '<button class="ghost" data-act="close">Close</button>')
    c.innerHTML = `<h1>${it.count === 1 ? '1 suggestion' : it.count + ' suggestions'} in this sentence</h1>${body}<div class="row">${buttons.join('')}</div>`
    c.onmouseenter = () => setHover(true)
    c.onmouseleave = () => setHover(false)
    c.onclick = (e) => {
      const b = e.target.closest('button')
      if (!b) return
      const act = b.dataset.act
      if (act === 'fix') { window.overlay.apply(it.id, it.fixed); state.card = null; setHover(false); render() }
      else if (act === 'use-ai') { window.overlay.apply(it.id, a.text); state.card = null; setHover(false); render() }
      else if (act === 'ai') { ai[it.id] = { busy: true }; window.overlay.rewrite(it.id); render() }
      else if (act === 'dismiss') { window.overlay.dismiss(it.id); state.card = null; setHover(false); render() }
      else closeCard()
    }
    // Flip the card above the sentence when it would run off the bottom of the screen.
    root.appendChild(c)
    const h = c.getBoundingClientRect().height
    if (last.y + last.h + 8 + h > state.size[1]) c.style.top = Math.max(8, it.lines[0].y - 8 - h) + 'px'
    report()
  }

  window.overlay.onRender((payload) => {
    const kept = {}
    for (const it of payload.items) if (ai[it.id]) kept[it.id] = ai[it.id]
    ai = kept
    state = payload
    render()
  })
  window.overlay.onRewrite((r) => {
    ai[r.id] = r.error ? { error: r.error } : { text: r.text }
    render()
  })
  window.overlay.debug({ loaded: true })
</script>
</body>
</html>
